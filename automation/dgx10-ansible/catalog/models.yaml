---
# ── DGX Spark model catalog ─────────────────────────────────────────
# What each OSS model costs to serve on one GB10: weights, KV cache at a
# given context, and the capabilities the verifier should exercise.
#
# The numbers are planning estimates, not measurements. Weights are the
# published GGUF / safetensors size for the quant. KV is the model's
# reported KV geometry expressed as GiB per 1k tokens at one sequence;
# the planner multiplies by context and parallel requests. Overhead is a
# flat allowance for the runtime, graphs and buffers. Replace an estimate
# with a measured value once `make verify` has run on that model.
#
# `name` is the catalog key and the Kubernetes resource name. `tag` is the
# exact runtime identifier (Ollama tag or HuggingFace repo).
version: 1

budget:
  unified_memory_gib: 128      # DGX Spark GB10: one unified pool
  host_reserve_gib: 8          # leave the host and system pods room
  gpu_time_slices: 5           # install-k8s.yml grants 5 replicas
  per_model_overhead_gib: 1.5

# The chart's pair. `base` profiles may only select these names; anything
# else belongs in `extras`.
base_models:
  - qwen3-coder-next
  - deepseek-r1-distill-32b

models:
  qwen3-coder-next:
    display_name: Qwen3 Coder Next
    tag: "qwen3-coder-next:q4_K_M"
    engine: ollama
    source: ollama
    params_b: 30
    quant: q4_K_M
    weights_gib: 19
    kv_gib_per_1k: 0.12
    default_ctx: 131072
    max_ctx: 131072
    default_parallel: 1
    capabilities: [chat, tools]
    license: Apache-2.0
    size: 60Gi
    notes: The chart sets numCtx 131072 for this entry.

  deepseek-r1-distill-32b:
    display_name: DeepSeek R1 Distill 32B
    tag: "deepseek-r1:32b"
