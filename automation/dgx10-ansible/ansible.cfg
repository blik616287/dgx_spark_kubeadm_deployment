[defaults]
inventory            = inventory/zrok.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = auto_silent
stdout_callback      = default
deprecation_warnings = False
# The wrapped playbooks run for tens of minutes (image pulls, helm --wait).
timeout              = 120

[ssh_connection]
pipelining = True
